databases:
  - name: cartel-club-db
    plan: free
    databaseName: cartelclub
    user: cartelclub

services:
  - type: web
    name: cartel-club
    runtime: node
    plan: free
    buildCommand: >-
      cd web && npm ci && npm run build &&
      cd ../server && npm ci && npm run build
    startCommand: cd server && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cartel-club-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_UPLOAD_MB
        value: 8
